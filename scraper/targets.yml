- name: home2u_inventory_sitemap
  url: "https://home2u.bg/sitemap_index.xml"
  mode: sitemap
  sitemap_url_regex: "/crb_(?:project|apartment)(?:-sitemap[0-9]*|-sitemap)\\.xml$"
  listing_url_regex: "^https://home2u\\.bg/(?:property|project)/"
  max_sitemaps: 100
  post_batch_items: 1000
  timeout_ms: 120000

- name: dskhome_inventory_sitemap
  url: "https://dskhome.bg/sitemap.xml"
  mode: sitemap
  sitemap_url_regex: "/ml-bff/listings/api/listings/.*\\.xml$"
  max_sitemaps: 150
  post_batch_items: 1000
  timeout_ms: 120000
  listing_url_regex: '^https://dskhome\.bg/listings/.+-[0-9]+$'
  # Listing pages are protected by Radware and return the same 200 challenge for
  # both real and fake URLs. The server-generated listing sitemap is therefore
  # the strongest non-destructive activity signal available.
  validation_mode: source

