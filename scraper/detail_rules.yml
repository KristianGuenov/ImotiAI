defaults:
  concurrency: 2
  # Minimum gap between navigation starts for one publisher. This preserves
  # concurrency across domains without creating same-domain request bursts.
  request_delay_ms: 250
  min_desc_len: 60
  wait_until: domcontentloaded
  timeout_ms: 45000
  extractor_script: /app/scraper/detail_extractor.js
  exclude_any:
  - ?page=
  - '&page='
  - /search
  - /obiavi/
  - /category
  - /filter
  - /login
  - /register
  - /account
  exclude_regex: []
  include_any: []
  include_regex: []
