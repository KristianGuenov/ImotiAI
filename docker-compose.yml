

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - extractor_db:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      API_KEY: ${API_KEY}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8787:8787"
    depends_on:
      - db

  # Bridge: Extension -> POST http://127.0.0.1:8788/profile -> writes repo-root site_profiles.json
  profile-sink:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "8788:8788"
    command: ["python", "/workspace/scraper/profile_sink.py", "--host", "0.0.0.0", "--port", "8788", "--out", "/workspace/site_profiles.json"]
    restart: unless-stopped


  # Regular/index scraper (list pages -> item URLs, image URLs, short text, etc.)
  scraper:
    profiles: ["scrape"]
    build:
      context: ./scraper
      dockerfile: Dockerfile
    environment:
      # Index runner uses this endpoint
      API_ENDPOINT: http://api:8787/api/v1/extractions
      API_KEY: ${API_KEY}
      SCRAPER_API_TIMEOUT_SECONDS: ${SCRAPER_API_TIMEOUT_SECONDS:-180}
      SCRAPER_DOMAIN_CONCURRENCY: ${SCRAPER_DOMAIN_CONCURRENCY:-6}
      SCRAPER_VALIDATE_LISTING_URLS: ${SCRAPER_VALIDATE_LISTING_URLS:-1}
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
      LISTING_VALIDATION_CONCURRENCY: ${LISTING_VALIDATION_CONCURRENCY:-72}
      LISTING_VALIDATION_DOMAIN_CONCURRENCY: ${LISTING_VALIDATION_DOMAIN_CONCURRENCY:-6}
      LISTING_VALIDATION_HEAD_DELAY_MS: ${LISTING_VALIDATION_HEAD_DELAY_MS:-75}
      LISTING_VALIDATION_GET_DELAY_MS: ${LISTING_VALIDATION_GET_DELAY_MS:-100}
      LISTING_VALIDATION_TIMEOUT_S: ${LISTING_VALIDATION_TIMEOUT_S:-20}
      LISTING_VALIDATION_RETRIES: ${LISTING_VALIDATION_RETRIES:-3}
      TARGETS_FILE: /app/targets.yml
      CONTENT_SCRIPT_PATH: /app/content.js
      TZ: Europe/Sofia

      # Make runner look here (matches your default anyway)
      SITE_PROFILES_PATH: /app/site_profiles.json

      # Realistimo (Cloudflare-protected) persistent session (optional)
      REALISTIMO_PROFILE_DIR: /data/realistimo-profile
      REALISTIMO_STORAGE_STATE_PATH: /data/realistimo-profile/storage_state.json
      IMOTEKA_STORAGE_STATE_PATH: /app/data/imoteka-storage-state.json

      # Detail runner defaults (can be overridden on CLI)
      API_BASE: http://api:8787
      DETAIL_RULES_FILE: /app/scraper/detail_rules.yml
      DETAIL_QUEUE_LIMIT: 200
      DETAIL_MAX_URLS: 200
      DETAIL_GLOBAL_CONCURRENCY: 6
      DETAIL_POST_BATCH_SIZE: 25

    shm_size: "1gb"
    volumes:
      - ./scraper/targets.yml:/app/targets.yml:ro
      - ./extension/content.js:/app/content.js:ro
      - ./scraper/detail_rules.yml:/app/scraper/detail_rules.yml
      - ./scraper/detail_extractor.js:/app/scraper/detail_extractor.js:ro

      # Realistimo persistent browser profile (created on host)
      - ./data/realistimo-profile:/data/realistimo-profile
      - ./data:/app/data
      # ✅ this is the important mount: repo-root file -> what runner reads
      - ./site_profiles.json:/app/site_profiles.json:ro
      - ./scraper:/app/scraper

    depends_on:
      - api
      - profile-sink

  # Optional daily full index inventory. It runs all sitemap and browser targets;
  # failed/incomplete domains are never reconciled.
  index_scheduler:
    profiles: ["schedule"]
    build:
      context: ./scraper
      dockerfile: Dockerfile
    environment:
      API_ENDPOINT: http://api:8787/api/v1/extractions
      API_KEY: ${API_KEY}
      SCRAPER_API_TIMEOUT_SECONDS: ${SCRAPER_API_TIMEOUT_SECONDS:-180}
      SCRAPER_DOMAIN_CONCURRENCY: ${SCRAPER_DOMAIN_CONCURRENCY:-6}
      SCRAPER_VALIDATE_LISTING_URLS: ${SCRAPER_VALIDATE_LISTING_URLS:-1}
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
      LISTING_VALIDATION_CONCURRENCY: ${LISTING_VALIDATION_CONCURRENCY:-72}
      LISTING_VALIDATION_DOMAIN_CONCURRENCY: ${LISTING_VALIDATION_DOMAIN_CONCURRENCY:-6}
      LISTING_VALIDATION_HEAD_DELAY_MS: ${LISTING_VALIDATION_HEAD_DELAY_MS:-75}
      LISTING_VALIDATION_GET_DELAY_MS: ${LISTING_VALIDATION_GET_DELAY_MS:-100}
      LISTING_VALIDATION_TIMEOUT_S: ${LISTING_VALIDATION_TIMEOUT_S:-20}
      LISTING_VALIDATION_RETRIES: ${LISTING_VALIDATION_RETRIES:-3}
      TARGETS_FILE: /app/targets.yml
      CONTENT_SCRIPT_PATH: /app/content.js
      SITE_PROFILES_PATH: /app/site_profiles.json
      INDEX_RUN_AT: ${INDEX_RUN_AT:-00:30}
      INDEX_RUN_ON_START: ${INDEX_RUN_ON_START:-0}
      TZ: Europe/Sofia
      REALISTIMO_PROFILE_DIR: /data/realistimo-profile
      REALISTIMO_STORAGE_STATE_PATH: /data/realistimo-profile/storage_state.json
      IMOTEKA_STORAGE_STATE_PATH: /app/data/imoteka-storage-state.json
    shm_size: "1gb"
    volumes:
      - ./scraper/targets.yml:/app/targets.yml:ro
      - ./extension/content.js:/app/content.js:ro
      - ./site_profiles.json:/app/site_profiles.json:ro
      - ./scraper:/app/scraper:ro
      - ./data/realistimo-profile:/data/realistimo-profile
      - ./data:/app/data
    command: ["python", "-m", "scraper.index_scheduler"]
    depends_on:
      - api

  # Optional: runs the detail runner once per day and drains the whole queue (multi-domain).
  # Enable with: docker compose --profile schedule up -d detail_scheduler
  detail_scheduler:
    profiles: ["schedule"]
    build:
      context: ./scraper
      dockerfile: Dockerfile
    environment:
      API_BASE: http://api:8787
      API_KEY: ${API_KEY}
      TZ: Europe/Sofia
      DETAIL_RULES_FILE: /app/scraper/detail_rules.yml

      # Schedule settings
      DETAIL_RUN_AT: "05:00"          # Europe/Sofia
      DETAIL_RUN_ON_START: "0"        # set to 1 if you want an immediate run at container start

      # Detail runner tuning (used by detail_scheduler -> detail_runner)
      DETAIL_QUEUE_LIMIT: 300
      DETAIL_MAX_URLS: 300
      DETAIL_GLOBAL_CONCURRENCY: 6
      DETAIL_POST_BATCH_SIZE: 25
      DETAIL_BATCH_SLEEP_S: "0.5"
    shm_size: "1gb"
    volumes:
      - ./scraper/detail_rules.yml:/app/scraper/detail_rules.yml:ro
      - ./scraper/detail_extractor.js:/app/scraper/detail_extractor.js:ro
    command: ["python", "-m", "scraper.detail_scheduler"]
    depends_on:
      - api

volumes:
  extractor_db:
